# ============================================================================
# ResolveGrid — Production Nginx Reverse Proxy Config for aetherhost.com.ng
# Subdomains:
#   - resolve.aetherhost.com.ng     -> Next.js 15 Web Console (port 3000)
#   - api.resolve.aetherhost.com.ng -> Node.js Core & NIPOST Gateway (port 4000)
#   - ml.resolve.aetherhost.com.ng  -> FastAPI LLM Agent & LightGBM (port 8000)
# ============================================================================

server {
    listen 80;
    server_name resolve.aetherhost.com.ng;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.resolve.aetherhost.com.ng;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ml.resolve.aetherhost.com.ng;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
