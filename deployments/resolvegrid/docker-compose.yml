
services:
  app:
    # AetherHost invokes this compose file from deployments/resolvegrid, but the
    # production application is the monorepo two levels above it. Building this
    # folder served only the placeholder status page and caused the public 404s.
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=aetherhost-net"
      - "traefik.http.routers.resolvegrid-app.rule=Host(`resolvegrid.aetherhost.com.ng`)"
      - "traefik.http.routers.resolvegrid-app.entrypoints=websecure"
      - "traefik.http.routers.resolvegrid-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.resolvegrid-app.loadbalancer.server.port=3000"
    networks:
      - aetherhost-net
networks:
  aetherhost-net:
    external: true
